name: render
on:
  push:
    paths: ["jobs/**/job.json"]
  workflow_dispatch:
    inputs:
      id:
        description: "ID job yang dirender ulang (kosong = semua job yang belum punya rilis)"
        required: false
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install --quiet numpy scipy
      - name: Render job baru
        env:
          GH_TOKEN: ${{ github.token }}
          WORKERS: "3"
          ID: ${{ inputs.id }}
        run: bash kerja/jalan.sh
